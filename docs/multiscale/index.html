<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PeerCompute Multiscale Ladder</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%23020409'/%3E%3Ccircle cx='16' cy='16' r='11' fill='none' stroke='%237dffb1' stroke-width='3'/%3E%3Ccircle cx='16' cy='16' r='3' fill='%23ff5b8d'/%3E%3C/svg%3E" />
    <script type="module" crossorigin src="./assets/index-CzBlNOGU.js"></script>
    <link rel="modulepreload" crossorigin href="./assets/UlgDispatchServiceAdapters-B0L3yEMC.js">
    <link rel="modulepreload" crossorigin href="./assets/taskRuntime-DX9oqDud.js">
    <link rel="modulepreload" crossorigin href="./assets/sourceSinkContract-Du-iQieI.js">
    <link rel="modulepreload" crossorigin href="./assets/webgpuLadderCompute-L7iyOq_x.js">
    <link rel="modulepreload" crossorigin href="./assets/nbodyGravityTasks.js">
    <link rel="modulepreload" crossorigin href="./assets/reactiveThermalTasks.js">
    <link rel="modulepreload" crossorigin href="./assets/maxwellTasks.js">
    <link rel="modulepreload" crossorigin href="./assets/cosmologyExpansionTasks.js">
    <link rel="modulepreload" crossorigin href="./assets/molecularDynamicsTasks.js">
    <link rel="modulepreload" crossorigin href="./assets/sphMaterialTasks.js">
    <link rel="modulepreload" crossorigin href="./assets/hydroAtmosphereTasks.js">
    <link rel="modulepreload" crossorigin href="./assets/radiationOpacityTasks.js">
    <link rel="modulepreload" crossorigin href="./assets/stellarFusionTasks.js">
    <link rel="modulepreload" crossorigin href="./assets/magnetospherePlasmaTasks.js">
    <link rel="modulepreload" crossorigin href="./assets/picPlasmaPatchTasks.js">
    <link rel="modulepreload" crossorigin href="./assets/relativisticCorrectionTasks.js">
    <link rel="modulepreload" crossorigin href="./assets/combustionPlumeTasks.js">
    <link rel="modulepreload" crossorigin href="./assets/membraneShellTasks.js">
    <link rel="stylesheet" crossorigin href="./assets/index-1lxJDDJO.css">
  </head>
  <body>
    <main id="app">
      <canvas id="multiscale-canvas" aria-label="Multiscale physics ladder viewport"></canvas>
      <nav id="output-toggles" class="terminal output-toggles" aria-label="output visibility toggles"></nav>

      <div class="terminal hud">
        <section class="panel left">
          <div class="eyebrow">PeerCompute / Multiscale Runtime</div>
          <h1>Scale Ladder</h1>
          <div id="scale-buttons" class="scale-buttons"></div>
          <label class="range-row">
            <span>zoom depth</span>
            <input id="scale-slider" type="range" min="0" max="7" step="1" value="0" />
          </label>
          <div class="control-grid">
            <button id="zoom-out" type="button" aria-label="zoom out one layer">-</button>
            <button id="zoom-in" type="button" aria-label="zoom in one layer">+</button>
            <button id="auto-tour" type="button">tour</button>
            <button id="rupture" type="button">burst</button>
            <button id="quality-down" type="button">sim -</button>
            <button id="quality-up" type="button">sim +</button>
            <button id="scenario-magnetar" type="button" aria-pressed="false">magnetar</button>
          </div>
          <div class="control-grid hud-mode-controls" aria-label="hud display mode">
            <button id="hud-focus" type="button" aria-pressed="true">focus</button>
            <button id="hud-telemetry" type="button" aria-pressed="false">telemetry</button>
          </div>
        </section>

        <section class="panel runtime-panel" aria-label="runtime debug panel">
          <div class="eyebrow">runtime debug</div>
          <h2>Compute Fabric</h2>
          <dl id="runtime-debug-readout"></dl>
        </section>

        <section class="panel right">
          <div class="eyebrow">active layer</div>
          <h2 id="layer-name">Supergalactic Web</h2>
          <div id="compute-status" class="status-line" aria-live="polite">compute initializing</div>
          <dl id="layer-readout"></dl>
          <label class="range-row">
            <span>oxygen</span>
            <input id="oxygen" type="range" min="0" max="0.35" step="0.01" value="0.21" />
          </label>
          <label class="range-row">
            <span>stellar flux</span>
            <input id="stellar-flux" type="range" min="0.2" max="2.8" step="0.05" value="1" />
          </label>
          <label class="range-row">
            <span>gravity</span>
            <input id="gravity" type="range" min="0" max="24" step="0.1" value="9.8" />
          </label>
          <label class="range-row">
            <span>ambient K</span>
            <input id="ambient-temperature" type="range" min="80" max="3200" step="1" value="294" />
          </label>
          <label class="range-row">
            <span>pressure Pa</span>
            <input id="ambient-pressure" type="range" min="100" max="5000000" step="25" value="101325" />
          </label>
          <label class="range-row">
            <span>electric V/m</span>
            <input id="electric-field" type="range" min="-10000000000" max="10000000000" step="1000000" value="0" />
          </label>
          <label class="range-row">
            <span>magnetic T</span>
            <input id="magnetic-field" type="range" min="-100" max="100" step="0.1" value="0" />
          </label>
          <div class="molecule-builder" aria-label="molecular dynamics atom controls">
            <div class="eyebrow">molecular input</div>
            <div class="atom-row">
              <select id="atom-symbol" aria-label="atom element"></select>
              <input id="atom-count" type="number" min="1" max="512" step="1" value="1" aria-label="atom count" />
              <button id="atom-add" type="button">add</button>
            </div>
            <div class="control-grid molecule-presets">
              <button id="atom-water" type="button">H2O x5</button>
              <button id="atom-co2" type="button">CO2 x4</button>
              <button id="atom-air" type="button">air mix</button>
              <button id="atom-reset" type="button">reset</button>
            </div>
            <div class="control-grid molecule-source-controls">
              <button id="molecular-buffer-apply" type="button">buf apply</button>
              <button id="molecular-buffer-auto" type="button" aria-pressed="false">buf auto</button>
            </div>
            <div id="molecular-buffer-status" class="recipe-line" aria-live="polite">buffer writer idle</div>
            <div id="molecule-recipe" class="recipe-line" aria-live="polite">H48 O24 / 72 atoms</div>
          </div>
          <div class="molecule-builder" aria-label="electron orbital controls">
            <div class="eyebrow">orbital input</div>
            <div class="orbital-row">
              <select id="orbital-element" aria-label="orbital element"></select>
              <input id="orbital-n" type="number" min="1" max="7" step="1" value="2" aria-label="principal shell n" />
              <input id="orbital-l" type="number" min="0" max="4" step="1" value="1" aria-label="angular momentum l" />
              <input id="orbital-m" type="number" min="-4" max="4" step="1" value="0" aria-label="magnetic quantum number m" />
            </div>
            <div class="orbital-row orbital-grid-row">
              <input id="orbital-grid" type="number" min="8" max="32" step="1" value="18" aria-label="finite grid size" />
              <button id="orbital-apply" type="button">apply orbital</button>
            </div>
            <div id="orbital-status" class="recipe-line" aria-live="polite">O 2p / grid 18</div>
          </div>
        </section>

        <section class="packet">
          <div class="eyebrow">warm delta / closure packet</div>
          <pre id="packet-readout"></pre>
        </section>
      </div>
    </main>
  </body>
</html>
