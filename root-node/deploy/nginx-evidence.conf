# Include inside the existing secretworkshop.net TLS server. This adds only a
# public descriptor; relay WebSocket/TURN locations and ports stay unchanged.
location = /peercompute/config/model-evidence.json {
    alias /var/lib/peercompute-root/public/model-evidence.json;
    default_type application/json;
    add_header Access-Control-Allow-Origin "*" always;
    add_header Cross-Origin-Resource-Policy "cross-origin" always;
    add_header Cache-Control "no-store" always;
}
