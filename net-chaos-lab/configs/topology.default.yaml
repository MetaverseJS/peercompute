network:
  name: peercompute-chaos-lab
  dual_stack: true
  core_switch: core

agents:
  count: 12
  image: mcr.microsoft.com/playwright:v1.56.1-noble
  command: sleep infinity
  cpu_shares: 512
  memory: 1g
  media_enabled: true

segments:
  - id: lan_a
    ipv4_subnet: 10.40.10.0/24
    ipv6_subnet: fd42:40:10::/64
    gateway4: 10.40.10.1
    gateway6: fd42:40:10::1
    nat:
      enabled: true
      type: full-cone
      uplink_ipv4: 10.40.1.10/24
      uplink_ipv6: fd42:40:1:10::1/64
  - id: lan_b
    ipv4_subnet: 10.40.20.0/24
    ipv6_subnet: fd42:40:20::/64
    gateway4: 10.40.20.1
    gateway6: fd42:40:20::1
    nat:
      enabled: true
      type: symmetric
      uplink_ipv4: 10.40.1.20/24
      uplink_ipv6: fd42:40:1:20::1/64
  - id: lan_c
    ipv4_subnet: 10.40.30.0/24
    ipv6_subnet: fd42:40:30::/64
    gateway4: 10.40.30.1
    gateway6: fd42:40:30::1
    nat:
      enabled: true
      type: port-restricted
      uplink_ipv4: 10.40.1.30/24
      uplink_ipv6: fd42:40:1:30::1/64

core_services:
  subnet_ipv4: 10.40.254.0/24
  subnet_ipv6: fd42:40:254::/64
  dns:
    host: dns.peercompute.test
    ipv4: 10.40.254.2/24
    ipv6: fd42:40:254::2/64
    image: node:24-bookworm
  https:
    host: demos.peercompute.test
    ipv4: 10.40.254.10/24
    ipv6: fd42:40:254::10/64
    image: node:24-bookworm
  relay:
    host: relay.peercompute.test
    ipv4: 10.40.254.20/24
    ipv6: fd42:40:254::20/64
    image: node:24-bookworm
  turn:
    host: turn.peercompute.test
    ipv4: 10.40.254.30/24
    ipv6: fd42:40:254::30/64
    image: node:24-bookworm

links:
  defaults:
    bw_mbit: 100
    delay_ms: 8
    loss_pct: 0
  overrides:
    - from: lan_a
      to: core
      bw_mbit: 50
      delay_ms: 12
      loss_pct: 0
    - from: lan_b
      to: core
      bw_mbit: 25
      delay_ms: 20
      loss_pct: 0.5
    - from: lan_c
      to: core
      bw_mbit: 15
      delay_ms: 30
      loss_pct: 1

harness:
  default_demo: netviz
  default_url: https://demos.peercompute.test/netviz/
  min_expected_peers: 2
  probe_duration_ms: 30000
