  <text x="600" y="157" font-size="22" text-anchor="middle" fill="#234d42">Next step keeps the same identity; stop on completion, cancellation or budget.</text>
  <text x="600" y="222" font-size="21" text-anchor="middle" fill="#234d42">Local-only excludes remote inference and remote routing. Peer scores always return to local checks.</text>
