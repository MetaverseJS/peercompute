ights</text></g><g data-box="true"><rect x="700" y="280" width="280" height="115" rx="12" fill="white" stroke="#ad7132" stroke-width="2"/><text x="718" y="311" font-size="23" fill="#ad7132" font-weight="700">Held-out evaluation</text><text x="718" y="340" font-size="20" fill="#173b3a" font-weight="500">Unseen tasks + retention</text><text x="718" y="365" font-size="20" fill="#173b3a" font-weight="500">Equal compute budgets</text></g><g data-box="true"><rect x="360" y="280" width="280" height="115" rx="12" fill="white" stroke="#14776d" stroke-width="2"/><text x="378" y="311" font-size="23" fill="#14776d" font-weight="700">Policy registry</text><text x="378" y="340" font-size="20" fill="#173b3a" font-weight="500">Accept tested checkpoint</text><text x="378" y="365" font-size="20" fill="#173b3a" font-weight="500">Version / rollback</text></g><g data-box="true"><rect x="20" y="280" width="280" height="115" rx="12" fill="white" stroke="#14776d" stroke-width="2"/><text x="38" y="311" font-size="23" fill="#14776d" font-weight="700">Embodied agent</text><text x="38" y="340" font-size="20" fill="#173b3a" font-weight="500">Deploy learned policy</text><text x="38" y="365" font-size="20" fill="#173b3a" font-weight="500">Measure new outcomes</text></g><path d="M300 87 H360" fill="none" stroke="#406b92" stroke-width="3" marker-end="url(#406b92)" /><path d="M640 87 H700" fill="none" stroke="#14776d" stroke-width="3" marker-end="url(#14776d)" /><path d="M840 140 V280" fill="none" stroke="#ad7132" stroke-width="3" marker-end="url(#ad7132)" /><path d="M700 337 H640" fill="none" stroke="#ad7132" stroke-width="3" marker-end="url(#ad7132)" /><path d="M360 337 H300" fill="none" stroke="#14776d" stroke-width="3" marker-end="url(#14776d)" /><path d="M160 280 V140" fill="none" stroke="#406b92" stroke-width="3" marker-end="url(#406b92)" /><text x="24" y="453" font-size="22" fill="#173b3a" font-weight="500">Curriculum may evolve; evaluation definitions are versioned independently.</text></g><