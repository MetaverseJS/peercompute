<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 440" role="img" aria-label="Agent identity and versioned checkpoint artifacts"><title>Agent identity and versioned checkpoint artifacts</title><defs><marker id="14776d" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#14776d"/></marker><marker id="ad7132" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#ad7132"/></marker><marker id="406b92" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#406b92"/></marker></defs><g font-family="Noto Sans,Arial,sans-serif"><g data-box="true"><rect x="20" y="150" width="240" height="120" rx="12" fill="white" stroke="#14776d" stroke-width="2"/><text x="38" y="181" font-size="23" fill="#14776d" font-weight="700">Stable agent ID</text><text x="38" y="210" font-size="20" fill="#173b3a" font-weight="500">Independent of host</text><text x="38" y="235" font-size="20" fill="#173b3a" font-weight="500">Signed head + epoch</text></g><g data-box="true"><rect x="335" y="150" width="270" height="120" rx="12" fill="white" stroke="#14776d" stroke-width="2"/><text x="353" y="181" font-size="23" fill="#14776d" font-weight="700">Checkpoint manifest</text><text x="353" y="210" font-size="20" fill="#173b3a" font-weight="500">Body + schema versions</text><text x="353" y="235" font-size="20" fill="#173b3a" font-weight="500">Tick, RNG and state</text></g><g data-box="true"><rect x="690" y="20" width="285" height="85" rx="12" fill="white" stroke="#14776d" stroke-width="2"/><text x="708" y="51" font-size="23" fill="#14776d" font-weight="700">Shared parameters</text><text x="708" y="80" font-size="20" fill="#173b3a" font-weight="500">Policy / model CIDs</text></g><g data-box="true"><rect x="690" y="125" width="285" height="85" rx="12" fill="